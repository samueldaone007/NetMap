services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netmap
      POSTGRES_USER: netmap
      POSTGRES_PASSWORD: netmap
    ports:
      - "5433:5432"
    volumes:
      - netmap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmap -d netmap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netmap-pgdata:
